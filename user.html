<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login & Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }
        .container {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 350px;
            margin-bottom: 30px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-top: 10px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .message {
            margin-top: 15px;
            font-weight: bold;
            color: green;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Login Form</h2>
        <form id="loginForm">
            <label for="login-username">Username:</label>
            <input type="text" id="login-username" name="username">
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" name="password">
            <button type="button" id="login-btn">Login</button>
        </form>
        <div id="login-message" class="message">Login successful!</div>
    </div>

    <div class="container">
        <h2>Registration Form</h2>
        <form id="registerForm">
            <label for="reg-name">Name:</label>
            <input type="text" id="reg-name" name="name">
            <label for="reg-email">Email:</label>
            <input type="email" id="reg-email" name="email">
            <label for="reg-password">Password:</label>
            <input type="password" id="reg-password" name="password">
            <label for="reg-confirm">Confirm Password:</label>
            <input type="password" id="reg-confirm" name="confirm">
            <button type="button" id="register-btn">Register</button>
        </form>
        <div id="register-message" class="message">Registration successful!</div>
    </div>

    <script>
        document.getElementById("login-btn").addEventListener("click", function () {
            document.getElementById("login-message").style.display = "block";
        });

        document.getElementById("register-btn").addEventListener("click", function () {
            document.getElementById("register-message").style.display = "block";
        });
    </script>

</body>
</html>
